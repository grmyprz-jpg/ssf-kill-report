<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSF Kill Report</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1f2937;
    color:white;
    margin:20px;
}

h1{
    text-align:center;
    color:#4ade80;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#22c55e;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.player{
    background:#374151;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}
</style>

</head>

<body>

<h1>SSF Kill Report</h1>

<input id="playerName" placeholder="Nom du joueur">

<button onclick="addPlayer()">
Ajouter un joueur
</button>

<div id="list"></div>

<script>

let players=[];

function addPlayer(){

const input=document.getElementById("playerName");

if(input.value==="") return;

players.push({
name:input.value,
kills:0
});

input.value="";

displayPlayers();

}

function displayPlayers(){

const list=document.getElementById("list");

list.innerHTML="";

players.forEach(player=>{

list.innerHTML+=`
<div class="player">
<b>${player.name}</b><br>
Kills : ${player.kills.toLocaleString()}
</div>
`;

});

}

</script>

</body>
</html>
