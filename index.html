<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSF Kill Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>⚔️ SSF Kill Tracker ⚔️</h1>

    <button class="reset-btn" onclick="resetWeek()">
        🔄 Réinitialiser la semaine
    </button>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Joueur</th>
                <th>Kills départ</th>
                <th>Kills actuels</th>
                <th>Gain</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="joueurs">
        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
