<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSF Kill Report</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚔️ SSF Kill Report ⚔️</h1>

        <div class="actions">

            <button id="addPlayerBtn">➕ Ajouter un joueur</button>

            <button id="saveBtn">💾 Sauvegarder</button>

            <button id="resetBtn">🔄 Nouvelle semaine</button>

            <button id="exportBtn">📄 Export CSV</button>

        </div>

        <div class="searchBox">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Rechercher un joueur...">
        </div>

        <div class="stats">

            <div class="card">
                <h3>👥 Joueurs</h3>
                <p id="playerCount">0</p>
            </div>

            <div class="card">
                <h3>⚔️ Kills gagnés</h3>
                <p id="guildKills">0</p>
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Joueur</th>

                        <th>Départ</th>

                        <th>Actuel</th>

                        <th>Gain</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="joueurs">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
